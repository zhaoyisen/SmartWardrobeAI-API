server:
  port: 8080
  servlet:
    context-path: /
  # 优雅停机配置 (推荐)
  shutdown: graceful


spring:
  application:
    name: SmartWardrobeAI
    # ----------------------------------------
    # Java 21 虚拟线程配置 (Spring Boot 3.2+)
    # 开启后，Tomcat 将使用虚拟线程处理请求，大幅提升 AI I/O 并发能力
  # ----------------------------------------
  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意: 生产环境建议使用环境变量引用，如 ${DB_HOST:localhost}
    url: jdbc:mysql://127.0.0.1:3306/smart_wardrobe?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: dev
    password: dev123
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: SmartWardrobeHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 5000
      password: 123456

  # ----------------------------------------
  # 文件上传限制
  # ----------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # 单个文件大小限制
      max-request-size: 50MB   # 单次请求总大小

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always # 不忽略空值，或者 non_null 忽略空值

  mail:
    host: smtp.qq.com # 如果是163，写 smtp.163.com
    port: 587         # 或者 465 (需要 SSL)
    username: 1063034055@qq.com # 【替换】你的发送邮箱
    password: vjjekxcbyqhabejh  # 【替换】邮箱授权码 (不是登录密码！)
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


# ----------------------------------------
# MyBatis-Plus 配置
# ----------------------------------------
mybatis-plus:
  # Mapper XML 扫描路径 (如果以后要手写 SQL)
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类扫描包 (起别名，XML 中可以直接写 User 而不用写全路径)
  type-aliases-package: com.smartwardrobeai.model.entity

  configuration:
    # 开启自动驼峰命名转换 (table_id -> tableId)
    map-underscore-to-camel-case: true
    # 开启二级缓存 (默认 true)
    cache-enabled: false
    # SQL 日志输出到控制台 (开发环境强烈推荐，生产环境请改为 NO_LOGGING 或 STDOUT_LOGGING 慎用)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:
      # 全局主键策略: 数据库自增
      id-type: auto
      # 逻辑删除字段 (0:未删除, 1:已删除) - 以后如果做回收站功能会用到
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ----------------------------------------
# 自定义 JWT 配置
# ----------------------------------------
jwt:
  # 密钥必须足够长 (HS256 算法要求至少 32 字节)
  # 建议使用 UUID 生成一个随机串
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24小时 (毫秒)


# ----------------------------------------
# 日志级别控制
# ----------------------------------------
logging:
  level:
    root: INFO
    com.smartwardrobe.backend: DEBUG # 项目包开启 DEBUG 以便调试
    org.springframework.web: INFO

